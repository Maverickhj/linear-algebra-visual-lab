<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" role="img" aria-labelledby="vector-title vector-desc">
<title id="vector-title">向量加法：a (2, 1)，b (1, 2)，和 (3, 3)</title>
<desc id="vector-desc">横轴向右，纵轴向上，横纵同一单位长度。蓝色 a 与棕色 b 从原点出发，虚线表示平移后首尾相接的路径，绿色 a + b 到达共同终点。零向量用圆环表示。</desc>
<defs><marker id="arrow-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2563a6"/></marker><marker id="arrow-b" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#9c641d"/></marker><marker id="arrow-sum" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#087d79"/></marker><marker id="arrow-axis" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#68777d"/></marker></defs>
<rect width="640" height="600" fill="white"/>
<g font-family="system-ui,sans-serif" font-size="14" fill="#68777d"><path d="M 104 48 V 552 M 68 516 H 572" stroke="#e7ebe7" fill="none"/><text x="104" y="323" text-anchor="middle">-6</text><text x="306" y="521" text-anchor="end">-6</text><path d="M 140 48 V 552 M 68 480 H 572" stroke="#e7ebe7" fill="none"/><path d="M 176 48 V 552 M 68 444 H 572" stroke="#e7ebe7" fill="none"/><text x="176" y="323" text-anchor="middle">-4</text><text x="306" y="449" text-anchor="end">-4</text><path d="M 212 48 V 552 M 68 408 H 572" stroke="#e7ebe7" fill="none"/><path d="M 248 48 V 552 M 68 372 H 572" stroke="#e7ebe7" fill="none"/><text x="248" y="323" text-anchor="middle">-2</text><text x="306" y="377" text-anchor="end">-2</text><path d="M 284 48 V 552 M 68 336 H 572" stroke="#e7ebe7" fill="none"/><path d="M 356 48 V 552 M 68 264 H 572" stroke="#e7ebe7" fill="none"/><path d="M 392 48 V 552 M 68 228 H 572" stroke="#e7ebe7" fill="none"/><text x="392" y="323" text-anchor="middle">2</text><text x="306" y="233" text-anchor="end">2</text><path d="M 428 48 V 552 M 68 192 H 572" stroke="#e7ebe7" fill="none"/><path d="M 464 48 V 552 M 68 156 H 572" stroke="#e7ebe7" fill="none"/><text x="464" y="323" text-anchor="middle">4</text><text x="306" y="161" text-anchor="end">4</text><path d="M 500 48 V 552 M 68 120 H 572" stroke="#e7ebe7" fill="none"/><path d="M 536 48 V 552 M 68 84 H 572" stroke="#e7ebe7" fill="none"/><text x="536" y="323" text-anchor="middle">6</text><text x="306" y="89" text-anchor="end">6</text></g>
<path d="M 320 564 V 36" fill="none" stroke="#68777d" stroke-width="1.5" marker-end="url(#arrow-axis)"/>
<path d="M 56 300 H 584" fill="none" stroke="#68777d" stroke-width="1.5" marker-end="url(#arrow-axis)"/>
<g font-family="Georgia,serif" font-size="20" fill="#172c36"><text x="598" y="306">x</text><text x="329" y="28">y</text><text x="300" y="323" font-size="14">0</text></g>
<circle cx="320" cy="300" r="3" fill="#172c36"/>
<line data-vector="translated-b" x1="392" y1="264" x2="428" y2="192" stroke="#9c641d" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#arrow-b)"/>
<line data-vector="translated-a" x1="356" y1="228" x2="428" y2="192" stroke="#2563a6" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#arrow-a)"/>
<line data-vector="sum" x1="320" y1="300" x2="428" y2="192" stroke="#087d79" stroke-width="4"  marker-end="url(#arrow-sum)"/>
<line data-vector="a" x1="320" y1="300" x2="392" y2="264" stroke="#2563a6" stroke-width="2.5"  marker-end="url(#arrow-a)"/>
<line data-vector="b" x1="320" y1="300" x2="356" y2="228" stroke="#9c641d" stroke-width="2.5"  marker-end="url(#arrow-b)"/>
<text x="404" y="250" fill="#2563a6" font-family="Georgia,serif" font-size="21" font-style="italic" stroke="white" stroke-width="5" paint-order="stroke">a</text>
<text x="368" y="214" fill="#9c641d" font-family="Georgia,serif" font-size="21" font-style="italic" stroke="white" stroke-width="5" paint-order="stroke">b</text>
<text x="440" y="178" fill="#087d79" font-family="Georgia,serif" font-size="21" font-style="italic" stroke="white" stroke-width="5" paint-order="stroke">a + b</text>
<text x="320" y="590" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#536870">虚线 = 平移副本 · 横纵比例 1 : 1</text>
</svg>
